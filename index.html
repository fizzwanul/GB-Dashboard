<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101d33">
  <title>The GB Dash | GenBI Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <button id="closeSidebarBtn" class="mobile-close-btn" aria-label="Tutup menu">✕</button>
      <div class="brand">
        <div class="brand-mark"><img src="Logo Genbi.jpeg" alt="Logo GenBI"></div>
        <div class="brand-title"><strong>The GB Dash <span class="version-badge">V1</span></strong><small>GenBI Dashboard</small></div>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-page="overview"><span>▦</span> Dashboard</button>
        <button class="nav-item" data-page="members"><span>♙</span> Monitoring Anggota</button>
        <button class="nav-item" data-page="tasks"><span>▤</span> Monitoring Tugas</button>
      </nav>
      <div class="nav-bottom">
        
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="menuBtn" aria-label="Buka menu">☰</button>
        <div class="top-actions">
          <div id="googleLoginBtn"></div>
          <div id="userProfile" style="display:none; align-items: center; gap: 10px;">
            <div id="userAvatar" class="avatar" style="cursor:pointer; flex-shrink: 0;" onclick="openMyProfile()" title="Detail Keanggotaan"></div>
            <span id="userBadge" class="demo-pill" style="cursor:pointer;" onclick="openMyProfile()"></span>
            <button class="btn btn-light" id="logoutBtn" type="button" onclick="handleLogout()" style="padding: 6px 10px;">Keluar</button>
          </div>
          <select id="divisionSelect" class="select" style="font-weight: 600; padding: 8px 12px; border-radius: 8px;">
            <option value="pendidikan">Pendidikan</option>
            <option value="inti">Pengurus Inti</option>
            <option value="pubsos">Publikasi & Sosialisasi</option>
            <option value="pengabdian">Pengabdian Masyarakat</option>
            <option value="kewirausahaan">Kewirausahaan</option>
            <option value="lingkungan">Lingkungan Hidup</option>
          </select>
        </div>
      </header>
      <section class="content" id="content"></section>
      <footer>THE GB DASH · V1</footer>
    </main>
  </div>
<!-- Modal Add Proker -->
<dialog class="modal" id="addProkerModal">
  <div style="padding:24px; max-width: 400px; width: 100%;">
    <div class="modal-head">
      <div>
        <p class="eyebrow">PROKER BARU</p>
        <h2>Tambah Proker</h2>
      </div>
      <button class="icon-btn" type="button" onclick="document.getElementById('addProkerModal').close()">✕</button>
    </div>
    <form id="addProkerForm" onsubmit="submitAddProker(event)">
      <div class="field" style="margin-bottom:12px">
        <label>Nama Program Kerja</label>
        <input type="text" id="addProkerName" placeholder="Contoh: Rapat Rutin Bulanan" required>
      </div>
      <div class="field" style="margin-bottom:16px" id="addProkerScopeContainer">
        <label>Cakupan (Scope)</label>
        <select id="addProkerScope">
          <option value="divisi">Divisi (Lokal)</option>
          <option value="global">Global (Lintas Divisi)</option>
        </select>
        <small style="color:var(--text-muted); display:block; margin-top:4px;">Proker Global akan disimpan di sheet Pengurus Inti.</small>
      </div>
      <div class="modal-actions">
        <button class="btn btn-light" type="button" onclick="document.getElementById('addProkerModal').close()">Batal</button>
        <button class="btn btn-primary" type="submit">Tambah</button>
      </div>
    </form>
  </div>
</dialog>

<!-- Modal Tracker -->
<dialog class="modal" id="trackerModal">
  <div style="padding:24px; max-width: 500px; width: 100%;">
    <div class="modal-head">
      <div>
        <p class="eyebrow">RIWAYAT POIN KEAKTIFAN</p>
        <h2 id="trackerModalTitle">Tambah Riwayat</h2>
      </div>
      <button class="icon-btn" type="button" onclick="document.getElementById('trackerModal').close()">✕</button>
    </div>
    <form id="trackerForm" onsubmit="handleSaveTracker(event)">
      <input type="hidden" id="formTrackerRowId">
      <input type="hidden" id="formTrackerAction">
      
      <div class="field" style="margin-bottom:12px">
        <label>Tanggal</label>
        <input type="date" id="formTrackerTanggal" required>
      </div>

      <div class="field" style="margin-bottom:12px">
        <label>Aktivitas / Kegiatan</label>
        <input type="text" id="formTrackerKegiatan" placeholder="Contoh: Rapat koordinasi" required>
      </div>

      <div class="field" style="margin-bottom:12px">
        <label>Poin (+/-)</label>
        <input type="number" id="formTrackerPoin" placeholder="Contoh: 10 atau -5" required>
      </div>

      <div class="field" style="margin-bottom:16px">
        <label>Catatan Auditor</label>
        <textarea id="formTrackerCatatan" placeholder="Tambahkan catatan..."></textarea>
      </div>
      
      <div class="modal-actions">
        <button class="btn btn-light" type="button" onclick="document.getElementById('trackerModal').close()">Batal</button>
        <button class="btn btn-primary" type="submit">Simpan</button>
      </div>
    </form>
  </div>
</dialog>

 <!-- Modal Add / Upload Proker -->
<dialog class="modal" id="uploadModal">
  <div style="padding:24px; max-width: 500px; width: 100%;">
    <div class="modal-head">
      <div>
        <p class="eyebrow">MONITORING PROKER</p>
        <h2 id="modalProkerTitle">Update Proker</h2>
      </div>
      <button class="icon-btn" type="button" onclick="document.getElementById('uploadModal').close()">×</button>
    </div>
    <form id="prokerForm" onsubmit="handleSaveProker(event)">
      <input type="hidden" id="formProkerId">
      
      <div class="field" style="margin-bottom:12px">
        <label>Penanggung Jawab (PIC)</label>
        <input type="text" id="formPic" placeholder="Nama PIC / Penanggung jawab">
      </div>

      <div style="display: flex; gap: 12px; margin-bottom: 12px;">
        <div class="field" style="flex: 1;">
          <label>Progres (%) [0-100]</label>
          <input type="number" id="formProgres" min="0" max="100" required>
        </div>
        <div class="field" style="flex: 1;">
          <label>Status Proker</label>
          <select id="formStatus">
            <option value="Belum Mulai">Belum Mulai</option>
            <option value="Proses">Proses</option>
            <option value="Terkendala">Terkendala</option>
            <option value="Selesai">Selesai</option>
          </select>
        </div>
      </div>

      <div class="field" style="margin-bottom:12px">
        <label>Link Bukti (Pisahkan dengan Enter jika lebih dari 1)</label>
        <textarea id="formLinkBukti" placeholder="Masukkan link gdrive, youtube, dsb..."></textarea>
      </div>

      <div class="field" style="margin-bottom:12px">
        <label>Catatan</label>
        <textarea id="formCatatan" placeholder="Catatan atau kendala proker..."></textarea>
      </div>
      
      <div class="field" style="margin-bottom:16px">
        <label>Tenggat Waktu</label>
        <input type="date" id="formTenggat">
      </div>

      <div class="modal-actions">
        <button class="btn btn-light" type="button" onclick="document.getElementById('uploadModal').close()">Batal</button>
        <button class="btn btn-primary" type="submit">Simpan Perubahan</button>
      </div>
    </form>
  </div>
</dialog>
  <div class="toast" id="toast" role="status"></div>
  <script src="script.js"></script>
</body>
</html>
